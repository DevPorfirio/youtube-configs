name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint
        run: npx --yes web-ext lint

      - name: Build
        run: npx --yes web-ext build --artifacts-dir dist

      - name: Rename package
        run: mv dist/youtube_configs-*.zip dist/youtube-configs.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/youtube-configs.zip
          generate_release_notes: true
